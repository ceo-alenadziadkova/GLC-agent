name: Fast Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  security-gates:
    name: fast-gate / security-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Migration smoke
        run: |
          python - <<'PY'
          import glob, os, re, sys
          files = sorted(glob.glob('server/migrations/*.sql'))
          if not files:
            print('No migrations found')
            sys.exit(1)
          nums = [int(re.match(r'.*/(\d+)_', f).group(1)) for f in files if re.match(r'.*/(\d+)_', f)]
          if nums != sorted(nums):
            print('Migration numbering is not monotonic')
            sys.exit(1)
          print(f'Migration smoke passed: {len(files)} files, latest={os.path.basename(files[-1])}')
          PY
      - name: Security policy tests
        run: pnpm --filter glc-audit-server test -- src/tests/user-isolation.test.ts src/tests/public-http-url.test.ts src/tests/pipeline-error-fallback.test.ts

  question-stack-contracts:
    name: fast-gate / question-stack-contracts
    runs-on: ubuntu-latest
    needs: security-gates
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: question_stack
        with:
          filters: |
            changed:
              - 'packages/intake-core/src/question-bank.v1.json'
              - 'packages/intake-core/src/intake-policy.v1.json'
              - 'packages/intake-core/src/bank-question-ui-overrides.ts'
              - 'packages/intake-core/src/discovery-wizard-questions.ts'
      - uses: pnpm/action-setup@v4
        if: steps.question_stack.outputs.changed == 'true'
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        if: steps.question_stack.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        if: steps.question_stack.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Question stack required tests
        if: steps.question_stack.outputs.changed == 'true'
        run: |
          pnpm vitest src/app/data/bank-question-ui-catalog-parity.test.ts
          pnpm vitest src/app/lib/discovery-flow.test.ts
          pnpm --filter glc-audit-server test -- src/tests/question-bank-answer-contract.test.ts src/tests/discovery-ui-fragment.test.ts src/tests/question-stack-invariants.test.ts src/tests/question-plan-resolver-parity.test.ts
      - name: Skip message
        if: steps.question_stack.outputs.changed != 'true'
        run: echo "Question stack files unchanged — skipping focused contract tests."

  vitest:
    name: fast-gate / type-lint-unit
    runs-on: ubuntu-latest
    needs: [security-gates, question-stack-contracts]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Frontend unit tests
        run: pnpm test
      - name: Backend unit tests
        run: pnpm --filter glc-audit-server test

  playwright:
    name: fast-gate / e2e-smoke
    runs-on: ubuntu-latest
    needs: vitest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Start backend API (port 3001)
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key
          SUPABASE_ANON_KEY: test-anon-key
          JWT_SECRET: test-jwt-secret
          ALLOWED_ORIGINS: http://127.0.0.1:5173
          NODE_ENV: test
        run: |
          pnpm --filter glc-audit-server dev > /tmp/glc-backend.log 2>&1 &
      - name: Wait for backend readiness
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3001/api/health" > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become ready in time"
          echo "---- Backend log tail ----"
          tail -n 200 /tmp/glc-backend.log || true
          exit 1
      - name: E2E smoke
        run: pnpm run test:e2e
        env:
          CI: true
