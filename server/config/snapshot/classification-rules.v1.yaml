# Machine-readable site classification for free snapshot (rule-based, no LLM).
version: 5
tieDeltaThreshold: 1.35
globalCaps:
  contentQualityLow: low
  tieAmbiguous: low
  noSchemaThinText: low
# Priority: ES → EN → DE → CA → RU → IT → other locales (used for hint ordering / tie hints).
supportedLangPrefixes:
  - es
  - en
  - de
  - ca
  - ru
  - it
  - fr
  - pt
  - nl
  - pl
  - uk
  - ja
  - zh

# When top two site types are within tieDeltaThreshold, prefer earlier id (more specific product ordering).
tieBreakOrder:
  - ecommerce
  - saas
  - local-business
  - service-business
  - content-media

# When true, site-profile-runner logs richer signal detail (also respects SNAPSHOT_CLASSIFICATION_DEBUG=1).
debugSignals: false

siteTypes:
  - id: ecommerce
    priority: 70
    minMatch: 2
    signals:
      - { kind: schemaTypeAny, types: [Product, Offer, ItemList, Store, ShoppingCenter] }
      - { kind: ctaSubstringAny, substrings: ["añadir al carrito", "comprar ahora", "finalizar compra", "ir al carrito", "add to cart", "buy now", "checkout", "add to bag", "jetzt kaufen", "in den warenkorb", "zur kasse", "afegir a la cistella", "comprar ara", "finalitzar la compra", "в корзину", "купить сейчас", "оформить заказ", "aggiungi al carrello", "acquista ora", "procedi al checkout", "ajouter au panier", "toevoegen aan winkelwagen", "dodaj do koszyka", "adicionar ao carrinho", "立即购买"] }
      - { kind: techAny, names: [Shopify, WooCommerce, Magento] }
      - { kind: slugAny, substrings: [shop, cart, product, checkout, collection, winkelwagen, winkelmand, koszyk, panier, boutique] }

  - id: saas
    priority: 65
    minMatch: 2
    signals:
      - { kind: ctaSubstringAny, substrings: ["demostración gratuita", "prueba gratis", "empezar gratis", "solicitar demo", "agendar demo", "book a demo", "request demo", "start free trial", "get started", "sign up free", "try free", "kostenlos testen", "demo vereinbaren", "kostenlose testversion", "prova gratuïta", "sol·licitar demo", "бесплатная пробная версия", "демо-версия", "запросить демо", "prova gratuita", "richiedi demo", "richiedi una demo", "essai gratuit", "darmowa wersja próbna", "無料トライアル", "免费试用"] }
      - { kind: slugAny, substrings: [pricing, features, integrations, platform, api, security, compliance, trust, enterprise, soc2, soc 2] }
      - { kind: techAny, names: [Intercom, HubSpot] }
      - { kind: keywordAny, fields: [title, h1, metaDescription], substrings: ["saas", "software", "platform", "cloud", "b2b", "workflow", "subscription"] }

  - id: local-business
    priority: 55
    minMatch: 2
    signals:
      - { kind: schemaTypeAny, types: [LocalBusiness, Dentist, MedicalBusiness, Physician, Attorney, LegalService, Restaurant, FoodEstablishment, LodgingBusiness, AutoRepair, HomeAndConstructionBusiness] }
      - { kind: contactAll, flags: [addressPresent, openingHoursPresent] }
      - { kind: ctaSubstringAny, substrings: ["reservar cita", "pedir cita", "llámanos", "llamanos", "reserva tu cita", "book appointment", "call now", "visit us", "directions", "reserve", "reservierung", "termin buchen", "demana hora", "truca'ns", "reserva cita", "записаться на прием", "позвоните нам", "prenota visita", "chiamaci", "prenota appuntamento", "prendre rendez-vous", "prenons rendez-vous", "zarezerwuj", "забронювати", "予約"] }
      - { kind: contactAll, flags: [phonePresent, addressPresent] }

  - id: service-business
    priority: 45
    minMatch: 3
    signals:
      - { kind: slugAny, substrings: [services, service, consulting, agency, solutions, capabilities, industries, testimonials, clients, team, careers, case-studies, portfolio] }
      - { kind: keywordAny, fields: [title, h1, metaDescription], substrings: ["agency", "consulting", "services", "firm", "studio"] }
      - { kind: schemaTypeAny, types: [Organization, ProfessionalService] }

  - id: content-media
    priority: 35
    minMatch: 2
    signals:
      - { kind: slugAny, substrings: [blog, news, magazine, podcast, insights, authors, archive, episode, episodes] }
      - { kind: keywordAny, fields: [title, h1, metaDescription], substrings: ["blog", "magazine", "podcast", "newsletter", "editorial", "subscribe"] }

  - id: unknown
    priority: 0
    minMatch: 0
    signals: []

industries:
  - id: dental-clinic
    parentSiteTypes: [local-business]
    minMatch: 2
    signals:
      - { kind: schemaTypeAny, types: [Dentist, MedicalBusiness] }
      - { kind: keywordAny, fields: [title, h1, metaDescription, bodyTextSample], substrings: [dental, dentist, teeth, invisalign, implant, orthodont] }

  - id: law-firm
    parentSiteTypes: [service-business, local-business]
    minMatch: 2
    signals:
      - { kind: keywordAny, fields: [title, h1, metaDescription, bodyTextSample], substrings: [attorney, lawyer, legal, law firm, litigation] }
      - { kind: schemaTypeAny, types: [Attorney, LegalService] }
      - { kind: ctaSubstringAny, substrings: ["schedule consultation", "free consultation", "contact attorney"] }

  - id: digital-agency
    parentSiteTypes: [service-business]
    minMatch: 2
    signals:
      - { kind: keywordAny, fields: [title, h1, metaDescription, bodyTextSample], substrings: [web design, seo, branding, marketing agency, conversion, ux/ui, development agency] }
      - { kind: slugAny, substrings: [case-studies, portfolio, work, clients] }
      - { kind: ctaSubstringAny, substrings: ["book a call", "request a quote", "get a quote", "schedule call"] }

  - id: ecommerce-retail
    parentSiteTypes: [ecommerce]
    minMatch: 1
    signals:
      - { kind: schemaTypeAny, types: [Product, Store] }
      - { kind: keywordAny, fields: [title, h1, metaDescription], substrings: [shop, store, buy, collection, sale] }

  - id: software-saas
    parentSiteTypes: [saas]
    minMatch: 1
    signals:
      - { kind: keywordAny, fields: [title, h1, metaDescription], substrings: [software, platform, api, integration, dashboard, automate] }

  - id: unknown
    parentSiteTypes: []
    minMatch: 0
    signals: []

conversionModels:
  - id: ecommerce-checkout
    minMatch: 2
    signals:
      - { kind: ctaSubstringAny, substrings: ["añadir al carrito", "finalizar compra", "comprar ahora", "add to cart", "checkout", "buy now", "jetzt kaufen", "in den warenkorb", "afegir a la cistella", "в корзину", "aggiungi al carrello"] }
      - { kind: slugAny, substrings: [cart, checkout] }
      - { kind: schemaTypeAny, types: [Product, Offer] }

  - id: demo-request
    minMatch: 2
    signals:
      - { kind: ctaSubstringAny, substrings: ["solicitar demo", "agendar demo", "book demo", "request demo", "schedule demo", "see demo", "demo vereinbaren", "richiedi demo"] }
      - { kind: slugAny, substrings: [demo, sales, book-a-demo, "book-demo"] }

  - id: call-booking
    minMatch: 2
    signals:
      - { kind: ctaSubstringAny, substrings: ["llámanos", "llamanos", "llama ya", "call now", "call us", "phone", "book appointment", "termin buchen", "truca'ns", "chiamaci", "позвоните"] }
      - { kind: contactAll, flags: [phonePresent] }

  - id: whatsapp-contact
    minMatch: 1
    signals:
      - { kind: techAny, names: ["WhatsApp Widget"] }
      - { kind: ctaSubstringAny, substrings: [whatsapp, wa.me] }

  - id: lead-form
    minMatch: 2
    signals:
      - { kind: formPresent }
      - { kind: ctaSubstringAny, substrings: ["contáctenos", "contacto", "escríbenos", "contact", "get in touch", "submit", "send message", "request", "kontakt", "kontaktieren", "kontakt aufnehmen", "contacteu-nos", "poseu-vos en contacte", "свяжитесь с нами", "напишите нам", "contattaci", "scrivici", "nous contacter", "skontaktuj się", "お問い合わせ"] }

  - id: unknown
    minMatch: 0
    signals: []
